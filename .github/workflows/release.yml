# Push a tag matching manifest.json's version (e.g. v1.0.1) to publish to the Chrome Web Store.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node test.js

      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }

      - name: Zip
        run: zip -r directchange.zip manifest.json background.js content.js parse.js popup.html popup.js icons _locales -x 'icons/*.svg'

      - name: Upload and submit for review
        run: npx -y chrome-webstore-upload-cli@4 --source directchange.zip
        env:
          EXTENSION_ID: jempfanheojijeljdinblbpdhfelojkm
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" directchange.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
